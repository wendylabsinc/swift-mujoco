name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.3"

      - name: Install MuJoCo and a software GL stack
        env:
          MUJOCO_PREFIX: /home/runner/.local
        run: |
          set -euxo pipefail
          python3 -m venv .venv-mujoco
          ./.venv-mujoco/bin/pip install --upgrade pip
          ./.venv-mujoco/bin/pip install "mujoco==3.10.0"
          # libegl1 is only glvnd's dispatch library - it enumerates vendor
          # ICDs from /usr/share/glvnd/egl_vendor.d/ but ships no driver
          # itself. Mesa's ICD is libegl-mesa0, which libegl1 does not
          # depend on and which libgl1-mesa-dri does not pull in (the
          # dependency runs the other way); without it eglInitialize fails
          # with "no usable EGL driver". libgl1-mesa-dri supplies the
          # llvmpipe software rasterizer so this all works with no GPU.
          # libopengl0 (glvnd's libOpenGL.so.0) is separately required
          # because MuJoCo's mjr_makeContext resolves desktop-GL entry
          # points, which under glvnd live there rather than in libGL.
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1 libglx-mesa0 libgl1-mesa-dri libopengl0
          PYTHON="$PWD/.venv-mujoco/bin/python" bash Scripts/install-mujoco.sh

      - name: Install CycloneDDS for swift-ros2
        run: |
          set -euxo pipefail
          if ! sudo apt-get install -y libcyclonedds-dev; then
            git clone --depth 1 --branch 0.10.5 https://github.com/eclipse-cyclonedds/cyclonedds /tmp/cyclonedds
            cmake -S /tmp/cyclonedds -B /tmp/cyclonedds/build \
              -DENABLE_SHM=OFF -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DDSPERF=OFF
            sudo cmake --build /tmp/cyclonedds/build --target install
            sudo ldconfig
          fi

      - name: Build
        env:
          PKG_CONFIG_PATH: /home/runner/.local/lib/pkgconfig
          LD_LIBRARY_PATH: /home/runner/.local/lib
        run: swift build -v

      - name: Test
        env:
          PKG_CONFIG_PATH: /home/runner/.local/lib/pkgconfig
          LD_LIBRARY_PATH: /home/runner/.local/lib
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
          # Turns the render tests' legitimate dev-box skip into a hard failure
          # here, where Mesa llvmpipe IS installed. Without this, a runner that
          # loses its GL stack would report a green suite that rendered nothing.
          SWIFT_MUJOCO_REQUIRE_GL: "1"
        run: swift test -v

      # go2-demo proves its sim-to-real parity claim by resolving a real Go2
      # model, not a stub — via a *sparse* clone at .cache/mujoco_menagerie
      # (see Sources/go2-demo/main.swift's searchDirs and the README's
      # "Sim-to-real demo (Go2)" section). That's a different location and
      # shape than the full clone the macOS job caches above for Go2KitTests,
      # so it needs its own cache entry. The arch matrix leg is in the key
      # because both amd64 and arm64 run this job in parallel and would
      # otherwise race to populate the same cache entry.
      - name: Cache Go2 Menagerie sparse clone
        uses: actions/cache@v4
        with:
          path: .cache/mujoco_menagerie
          key: go2-menagerie-${{ runner.os }}-${{ matrix.arch }}

      - name: Fetch Go2 Menagerie model
        run: |
          set -euxo pipefail
          # Skip the network round-trip entirely on a cache hit.
          if [ ! -d .cache/mujoco_menagerie/unitree_go2 ]; then
            git clone --depth 1 --filter=blob:none --sparse \
              https://github.com/google-deepmind/mujoco_menagerie .cache/mujoco_menagerie
            git -C .cache/mujoco_menagerie sparse-checkout add unitree_go2
          fi

      # `sim` runs the same controller/encoder/decoder/adapter as `loopback`
      # but entirely in-process, with no DDS involved — it has no known-flaky
      # failure mode, so a plain non-zero exit is always a real regression.
      - name: Run go2-demo (sim)
        env:
          PKG_CONFIG_PATH: /home/runner/.local/lib/pkgconfig
          LD_LIBRARY_PATH: /home/runner/.local/lib
        run: swift run go2-demo --mode sim --steps 200

      # This is the actual CI regression guard for the sim-to-real parity
      # claim: `loopback` runs the identical pipeline as `sim` but drives it
      # over real DDS (CDR serialization, the Unitree CRC, the FR/FL/RR/RL
      # remap all get exercised). Its one known-flaky failure mode is DDS
      # discovery never completing in a sandboxed CI network — go2-demo
      # reports that case by printing "no LowCmd ever arrived over DDS" and
      # exiting 1, which is indistinguishable from a genuine crash by exit
      # code alone. ROS2TransportTests.swift treats the same condition as a
      # skip rather than a failure; this step matches that convention.
      #
      # GitHub's default bash run-step already sets `-eo pipefail`, which
      # would abort this script the moment `swift run` exits non-zero —
      # before we get to inspect *why*. `set +e` up front defers that
      # decision to the explicit checks below instead.
      - name: Run go2-demo (loopback)
        shell: bash
        env:
          PKG_CONFIG_PATH: /home/runner/.local/lib/pkgconfig
          LD_LIBRARY_PATH: /home/runner/.local/lib
        run: |
          set +e
          swift run go2-demo --mode loopback --steps 200 2>&1 | tee /tmp/go2-loopback.log
          exit_code=${PIPESTATUS[0]}
          set -e

          if [ "$exit_code" -eq 0 ]; then
            exit 0
          fi

          if grep -q "no LowCmd ever arrived over DDS" /tmp/go2-loopback.log; then
            echo "::warning::go2-demo loopback saw no DDS traffic in this CI sandbox (known limitation, matches the ROS2TransportTests DDS-discovery skip) — treating as a soft failure, not a CI failure."
            exit 0
          fi

          echo "go2-demo loopback failed for a reason other than DDS being unavailable — treating this as a real regression." >&2
          exit "$exit_code"

  macos:
    name: macOS
    # Must be >= the package's deployment target. Package.swift declares
    # .macOS(.v26) so that Mat3 can store its nine doubles in an InlineArray, which
    # is @available(macOS 26, *) — a macos-15 runner cannot execute the built tests.
    # The Linux jobs are unaffected: `platforms:` only constrains Apple platforms.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Go2KitTests (macOS-only, see Package.swift's `#if os(macOS)` block —
      # the Linux job never builds this target at all) constructs a real
      # Go2Environment, which resolves the real unitree_go2 model via
      # WendyMuJoCo.Menagerie. With no vendored copy on the runner, that's a
      # live `git clone` of google-deepmind/mujoco_menagerie into
      # Menagerie's cache dir (WorldSim.directory()/menagerie-cache, which
      # defaults to /tmp/wendy-worldsim/menagerie-cache since
      # WENDY_WORLDSIM_DIR isn't set here) on every single run. Caching it
      # means only the very first run (or a cache eviction) pays for the
      # clone; the content is pinned to whatever's on the Menagerie repo's
      # default branch and doesn't vary per-commit here, so a plain
      # OS-scoped key (no file hash) is enough.
      - name: Cache Menagerie clone
        uses: actions/cache@v4
        with:
          path: /tmp/wendy-worldsim/menagerie-cache
          key: menagerie-${{ runner.os }}

      - name: Install MuJoCo
        env:
          MUJOCO_PREFIX: /Users/runner/.local
        run: |
          set -euxo pipefail
          python3 -m venv .venv-mujoco
          ./.venv-mujoco/bin/pip install --upgrade pip
          ./.venv-mujoco/bin/pip install "mujoco==3.10.0"
          PYTHON="$PWD/.venv-mujoco/bin/python" bash Scripts/install-mujoco.sh

      - name: Build and test
        env:
          PKG_CONFIG_PATH: /Users/runner/.local/lib/pkgconfig
          # The MLX-backed RL demo is opt-in (see Package.swift). It used to be
          # gated on `#if os(macOS)`, which describes the machine running SwiftPM
          # rather than the build target — so cross-compiling to Linux from a Mac
          # pulled Metal-only mlx-swift into the graph. Set it explicitly here so
          # the demo target still gets compiled on the macOS job.
          MUJOCO_RL_DEMO: "1"
        run: |
          swift build -v
          # MLXPolicyTrainingTests exercises mlx-swift, which can't execute under a
          # plain SwiftPM CLI build — only xcodebuild compiles the Metal
          # shaders it needs at runtime. That target is verified locally via
          # `xcodebuild test` instead (see README's "RL sample (MLX-Swift)"
          # section) and never runs in CI.
          swift test -v --skip MLXPolicyTrainingTests

      # Regression guard for the manifest gating: a Linux-targeted build from a
      # macOS host must NOT pull in mlx-swift. `swift package describe` evaluates
      # the manifest, so this catches a revert to `#if os(macOS)` without needing
      # a Linux SDK installed on the runner.
      - name: Manifest gating for the RL demo
        env:
          PKG_CONFIG_PATH: /Users/runner/.local/lib/pkgconfig
        run: |
          set -euo pipefail
          if swift package describe --type json | grep -q '"mlx-swift"'; then
            echo "mlx-swift is in the dependency graph without MUJOCO_RL_DEMO=1" >&2
            exit 1
          fi
          MUJOCO_RL_DEMO=1 swift package describe --type json | grep -q '"mlx-swift"'
